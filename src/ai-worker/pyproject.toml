[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "content-os-ai-worker"
version = "0.2.0"
description = "Content OS AI worker — research/generate/review jobs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "structlog>=24.4,<26",
  "aio-pika>=9.4,<10",
  "httpx>=0.27,<1",
  "litellm>=1.50,<2",
]

[project.scripts]
content-os-ai-worker = "ai_worker.bootstrap.app:main"

[tool.hatch.build.targets.wheel]
packages = ["ai_worker"]

asyncapi: 3.0.0
info:
  title: Content OS Events
  version: 1.0.0
  description: >
    CloudEvents published by the API outbox. Wire types stay ai.* so the
    worker keeps binding. Versioned names are the next cutover, not this schema.
defaultContentType: application/cloudevents+json
channels:
  aiCommands:
    address: contentos.ai
    messages:
      researchRequested:
        $ref: "#/components/messages/ResearchRequested"
      contentGenerateRequested:
        $ref: "#/components/messages/ContentGenerateRequested"
      contentReviewRequested:
        $ref: "#/components/messages/ContentReviewRequested"
      topicLabelRequested:
        $ref: "#/components/messages/TopicLabelRequested"
operations:
  publishAiCommand:
    action: send
    channel:
      $ref: "#/channels/aiCommands"
    messages:
      - $ref: "#/channels/aiCommands/messages/researchRequested"
      - $ref: "#/channels/aiCommands/messages/contentGenerateRequested"
      - $ref: "#/channels/aiCommands/messages/contentReviewRequested"
      - $ref: "#/channels/aiCommands/messages/topicLabelRequested"
components:
  messages:
    ResearchRequested:
      name: ai.research
      payload:
        $ref: ./schemas/ai-research-requested.schema.json
    ContentGenerateRequested:
      name: ai.content.generate
      payload:
        $ref: ./schemas/ai-content-generate-requested.schema.json
    ContentReviewRequested:
      name: ai.content.review
      payload:
        $ref: ./schemas/ai-content-review-requested.schema.json
    TopicLabelRequested:
      name: ai.topics.label
      payload:
        $ref: ./schemas/ai-topics-label-requested.schema.json

name: content-os

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contentos}
      POSTGRES_USER: ${POSTGRES_USER:-contentos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-contentos}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    profiles: ["edge"]
    ports:
      - "${CADDY_HTTP_PORT:-8080}:80"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../src/studio/dist:/srv/studio:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  migrate:
    build:
      context: ../..
      dockerfile: ops/docker/Dockerfile.migrations
    environment:
      ConnectionStrings__Platform: Host=postgres;Port=5432;Database=${POSTGRES_DB:-contentos};Username=${POSTGRES_USER:-contentos};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: ops/docker/Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Platform: Host=postgres;Port=5432;Database=${POSTGRES_DB:-contentos};Username=${POSTGRES_USER:-contentos};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      RabbitMq__Uri: amqp://${RABBITMQ_USER:-contentos}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  ai-worker:
    build:
      context: ../..
      dockerfile: ops/docker/Dockerfile.ai-worker
    environment:
      CONTENT_OS_RABBITMQ_URL: amqp://${RABBITMQ_USER:-contentos}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/
      CONTENT_OS_API_BASE_URL: http://api:8080
      CONTENT_OS_AI_STUB: ${CONTENT_OS_AI_STUB:-true}
    depends_on:
      api:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  studio:
    build:
      context: ../..
      dockerfile: ops/docker/Dockerfile.studio
    ports:
      - "${STUDIO_PORT:-8080}:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
  caddy-data:
  caddy-config:
  blobs:
